<aside
    [ngClass]="['fixed left-0 top-0 h-full bg-sidebar text-sidebar-foreground transition-all duration-300 z-50 flex flex-col', collapsed ? 'w-16' : 'w-64']">

    <div class="p-4 border-b border-sidebar-accent">
        <div class="flex items-center justify-between">
            @if (!collapsed) {
            <h1 class="text-lg font-bold truncate">Panel Escolar</h1>
            }
            <button (click)="toggle.emit()" class="p-2 rounded-lg hover:bg-sidebar-accent transition-colors"
                [attr.aria-label]="collapsed ? 'Expandir menu' : 'Colapsar menu'">
                <svg [lucideIcon]="collapsed ? icons.ChevronRight : icons.ChevronLeft" class="w-5 h-5"></svg>
            </button>
        </div>
    </div>

    @if (user()) {
    <div [ngClass]="['p-4 border-b border-sidebar-accent', collapsed ? 'px-2' : '']">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-full bg-primary flex items-center justify-center flex-shrink-0">
                <svg [lucideIcon]="icons.UserCircle" class="w-6 h-6 text-primary-foreground"></svg>
            </div>
            @if (!collapsed) {
            <div class="min-w-0">
                <p class="font-medium truncate">{{ user()?.nombre }}</p>
                <p class="text-xs text-sidebar-foreground/70">
                    {{ getRoleLabel(user()!.role) }}
                </p>
            </div>
            }
        </div>
    </div>
    }

    <nav class="flex-1 overflow-y-auto p-2">
        <ul class="space-y-1">
            @for (item of filteredNavItems(); track item.href) {
            <li>
                <a [routerLink]="item.href" routerLinkActive="bg-primary text-primary-foreground"
                    [routerLinkActiveOptions]="{exact: true}"
                    class="flex items-center gap-3 px-3 py-2.5 rounded-lg transition-colors hover:bg-sidebar-accent"
                    [ngClass]="{'justify-center': collapsed}" [title]="collapsed ? item.label : ''">
                    
                    <svg [lucideIcon]="item.icon" class="w-5 h-5"></svg>

                    @if (!collapsed) {
                    <span>{{ item.label }}</span>
                    }
                </a>
            </li>
            }
        </ul>
    </nav>

    <div class="p-2 border-t border-sidebar-accent">
        <button (click)="onLogout()"
            class="flex items-center gap-3 w-full px-3 py-2.5 rounded-lg text-sidebar-foreground hover:bg-destructive hover:text-destructive-foreground transition-colors"
            [ngClass]="{'justify-center': collapsed}" [title]="collapsed ? 'Cerrar sesion' : ''">
            <svg [lucideIcon]="icons.LogOut" class="w-5 h-5"></svg>
            @if (!collapsed) {
            <span>Cerrar Sesion</span>
            }
        </button>
    </div>
</aside>
